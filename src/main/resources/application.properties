#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=org.example.fleets.mybatis.entity
# 应用服务 WEB 访问端口
server.port=8080
# RocketMQ（rocketmq-spring-boot-starter）
# 阿里云控制台: https://ons.console.aliyun.com
########## RocketMQ 通用配置
# RocketMQ NameServer地址
rocketmq.name-server=127.0.0.1:9876
# 生产者组
rocketmq.producer.group=im-producer-group
# 发送消息超时时间（毫秒）
rocketmq.producer.send-message-timeout=3000
# 消息最大大小（字节）
rocketmq.producer.max-message-size=4194304

# MySQL数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/fleets?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=org.example.fleets.*.model.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=is_deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Redis配置
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Redis 没有密码时不要配置 password，否则会尝试 AUTH
# spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.timeout=10000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-wait=-1ms
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# MongoDB配置
# 默认无认证（适合本地开发）；生产请设置环境变量 MONGO_USERNAME、MONGO_PASSWORD，或使用 MONGO_URI
# 有认证时示例: MONGO_USERNAME=root MONGO_PASSWORD=xxx 或 MONGO_URI=mongodb://root:xxx@localhost:27017/fleets?authSource=admin
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:fleets}
# 用户名密码留空则不认证；需要认证时设置环境变量 MONGO_USERNAME、MONGO_PASSWORD
spring.data.mongodb.authentication-database=${MONGO_AUTH_SOURCE:admin}
# 
雪花算法配置
# 机器ID（0-31），不同服务器使用不同的ID
snowflake.worker-id=${WORKER_ID:1}
# 数据中心ID（0-31），不同数据中心使用不同的ID
snowflake.datacenter-id=${DATACENTER_ID:1}

# Sa-Token 配置
# token 名称（同时也是 cookie 名称）- 改为 Authorization 以兼容标准 Bearer Token
sa-token.token-name=Authorization
# token 有效期（单位：秒）1天绝对过期，必须重新登录
sa-token.timeout=86400
# token 最低活跃频率（单位：秒）60秒无操作后 Token 失效，需重新登录
sa-token.active-timeout=420
# 是否允许同一账号多地同时登录（为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
sa-token.is-concurrent=true
# 在多人登录同一账号时，是否共用一个 token（为 true 时所有登录共用一个 token，为 false 时每次登录新建一个 token）
sa-token.is-share=false
# token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
sa-token.token-style=uuid
# 是否输出操作日志
sa-token.is-log=false
# 是否从 cookie 中读取 token
sa-token.is-read-cookie=false
# 是否从 header 中读取 token
sa-token.is-read-header=true
# token 前缀（设置为 Bearer 以兼容标准格式）
sa-token.token-prefix=Bearer

# ==================== Fleets 应用配置 ====================

# WebSocket 配置
fleets.websocket.online-expire-seconds=300
fleets.websocket.heartbeat-interval=30
fleets.websocket.allowed-origins=*
fleets.websocket.endpoint=/ws
fleets.websocket.application-destination-prefix=/app
fleets.websocket.user-destination-prefix=/user

# Mailbox 配置
fleets.mailbox.message-expire-days=7
fleets.mailbox.max-unread-count=1000
fleets.mailbox.pull-message-limit=100
fleets.mailbox.unread-count-cache-minutes=5
fleets.mailbox.enable-auto-cleanup=true

# 消息配置
fleets.message.max-content-length=5000
fleets.message.enable-content-filter=true
fleets.message.send-rate-limit=60
fleets.message.batch-send-limit=500

# Redis Key 前缀配置
fleets.redis.online-key-prefix=user:online:
fleets.redis.session-key-prefix=user:session:
fleets.redis.user-sessions-key-prefix=user:sessions:
fleets.redis.sequence-key-prefix=mailbox:seq:
fleets.redis.unread-count-key-prefix=mailbox:unread:
fleets.redis.sequence-expire-days=7

# 好友申请频控（实现 FriendRequestRateLimiter 后可将 rate-limit-enabled 设为 true）
fleets.friendship.rate-limit-enabled=false
fleets.friendship.pair-action-window-seconds=600
fleets.friendship.pair-action-max-count=20
fleets.friendship.min-interval-seconds-between-applies=30

# ==================== 文件上传配置 ====================
# 文件上传根目录(使用绝对路径，避免Tomcat临时目录问题)
file.upload.path=C:/fleets/upload
# 文件访问URL前缀(使用相对路径，前端代理会自动转发)
file.access.url=/files

# Spring文件上传配置
spring.servlet.multipart.enabled=true
# 单个文件最大大小
spring.servlet.multipart.max-file-size=100MB
# 请求最大大小
spring.servlet.multipart.max-request-size=100MB
# multipart临时目录(使用绝对路径)
spring.servlet.multipart.location=C:/fleets/temp
